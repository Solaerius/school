services:
  db:
    image: postgres:16-alpine
    container_name: mytasks-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - mytasks-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./api
    container_name: mytasks-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ}
    depends_on:
      - db
    ports:
      - "3100:3100"
    restart: unless-stopped

  web:
    build: ./web
    container_name: mytasks-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      TZ: ${TZ}
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mytasks-db-data:
